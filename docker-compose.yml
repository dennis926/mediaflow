# 仅用于**本地开发**的基础设施（数据库 / Redis / 对象存储）。
# 生产环境不使用 Docker：应用由 systemd 单元 mediaflow-api / mediaflow-web 运行，
# 反向代理与 TLS 由主机上的 Nginx 负责（详见 docs/DEPLOYMENT.md）。
version: '3.8'

networks:
  mediaflow:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  minio-data:

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mediaflow
      POSTGRES_USER: mediaflow
      POSTGRES_PASSWORD: mediaflow_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - mediaflow

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - mediaflow

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - mediaflow
